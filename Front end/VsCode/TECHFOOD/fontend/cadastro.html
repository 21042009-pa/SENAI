<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/cadastro.css" />
    <title>TechFood - Cadastro de Produtos</title>
</head>
<body>
     <div id="modal-boas-vindas" style="display: none">
      <div class="modal-bv-conteudo">
        <h2>👋 Bem-vindo ao TechFood!</h2>
        <p>Como podemos te chamar?</p>
        <input
          type="text"
          id="input-nome-cliente"
          placeholder="Digite seu nome..."
          maxlength="30"
        />
        <button id="btn-confirmar-nome">Confirmar</button>
      </div>
    </div>

    <header id="topo-loja">
      <h1 id="titulo-site">TechFood - Cadastro de Produtos</h1>
      <p id="boas-vindas">Carregando...</p>

      <input type="checkbox" id="bt_menu" />
      <label for="bt_menu" id="label-menu" aria-label="Abrir menu"
        >&#9776;</label
      >

      <nav id="menu">
        <ul>
          <li><a href="#grid-cardapio">Cardápio</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
          <li><a href="cadastro.html">Cadastrar Prato</a></li>
        </ul>
      </nav>
    </header>

    <main>
        <form action="#" method="POST" id="forms-cadastro">
            <label for="nome_prato">Nome do Prato:</label>
            <input type="text" id="nome-prato" name="nome-prato" placeholder="Nome do prato ">
            <label for="descricao_prato">Descrição do Prato:</label>
            <input type="text" id="descricao-prato" name="descricao-prato" placeholder="Descrição do prato">
            <label for="preco_prato">Preço do Prato:</label>
            <input type="number" id="preco-prato" name="preco-prato" placeholder="Preço do prato">
            
            <label for="categoria">categoria:</label>
            <select name="categoria" id="categoria" >
                <option value="">Selecione</option>
                <option value="Massas">Massas</option>
                <option value="Sobremesas">Sobremesas</option>
            </select>

            <label for="avatar">Foto do Prato:</label>
            <input type="file" id="foto-prato" name="foto-prato">
             <button type="submit" id="button-foto">Enviar Foto</button>

            <button type="submit" id="button-eviar">Enviar Cadastro</button>
            <button type="reset" id="button-limpar">Limpar Tudo</button>
            
        </form>
    </main>



    <footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
        <p>Av. das Nações, 1500</p>
      </div>
      <p id="data-hora-footer"></p>
    </footer>

    <script src="src/scripts/global.js"></script>
    <script src="src/scripts/api.js"></script>
    <script src="src/scripts/main.js"></script>
</body>
</html>
